<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1015" />
  <meta name="description" content="VocabFast – schneller Englisch-Deutsch Vokabeltrainer" />
  <title>VocabFast</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    window.addEventListener('error', function (event) {
      var box = document.getElementById('fatal-error');
      if (!box) return;
      box.hidden = false;
      box.textContent = 'Die App konnte nicht gestartet werden: ' + (event.message || 'Unbekannter Fehler');
    });
  </script>
  <script defer src="./data/core-vocabulary.js"></script>
  <script defer src="./data/theme-packs.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="fatal-error" class="fatal-error" hidden></div>
  <noscript><div class="fatal-error">Bitte JavaScript aktivieren, damit VocabFast funktioniert.</div></noscript>
  <div id="app"><div class="boot">VocabFast wird geladen …</div></div>
</body>
</html>
