name: VocabFast selftest
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run selftest
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Build GitHub ZIP
        working-directory: .
        run: zip -r VocabFast_V8_TEST_ADMIN_GitHub.zip vocabfast-web -x 'vocabfast-web/node_modules/*' 'vocabfast-web/.wrangler-dry/*'
      - uses: actions/upload-artifact@v4
        with:
          name: VocabFast_V8_TEST_ADMIN_GitHub
          path: VocabFast_V8_TEST_ADMIN_GitHub.zip
          retention-days: 14
