name: VocabFast selftest
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run selftest
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry
