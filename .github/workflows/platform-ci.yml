name: VocabFast Language Platform CI
on:
  push:
    branches: [vocabfast-language-platform]
    paths:
      - 'vocabfast-platform/**'
      - '.github/workflows/platform-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build platform
        run: npm run build
