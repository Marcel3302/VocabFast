name: VocabFast platform checks
on:
  push:
    branches: [vocabfast-language-platform]
  workflow_dispatch:

jobs:
  platform-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build platform
        run: npm run build
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: VocabFast_PLATFORM_PREVIEW
          path: vocabfast-platform/dist
          retention-days: 14

  worker-api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker sources
        run: npm run check
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-platform-dry
