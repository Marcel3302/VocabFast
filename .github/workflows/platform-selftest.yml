name: VocabFast platform checks
on:
  push:
    branches: [vocabfast-language-platform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: vocabfast-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check preview Worker
        run: npm run check:preview-worker
      - name: Build platform
        run: npm run build
      - name: Verify isolated Cloudflare preview bundle
        run: npx wrangler deploy --config wrangler.preview.jsonc --dry-run --outdir .wrangler-preview-dry
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: VocabFast_PLATFORM_PREVIEW
          path: vocabfast-platform/dist
          retention-days: 14
      - name: Deploy isolated Cloudflare preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy --config wrangler.preview.jsonc
      - name: Smoke test live preview account API
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          sleep 3
          BASE='https://vocabfast.net'
          COOKIE_JAR="$(mktemp)"
          TEST_EMAIL="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          TEST_PASSWORD='VocabFast-CI-Only-2026!'

          echo '--- health ---'
          curl --fail-with-body --silent --show-error "$BASE/api/preview/health"
          echo

          echo '--- anonymous me ---'
          curl --fail-with-body --silent --show-error "$BASE/api/preview/me"
          echo

          echo '--- invalid login storage probe ---'
          LOGIN_STATUS=$(curl --silent --show-error -o /tmp/vf-login-probe.json -w '%{http_code}' \
            -H 'Origin: https://vocabfast.net' \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/preview/auth/login" \
            --data '{"email":"nobody@example.invalid","password":"definitely-wrong"}')
          cat /tmp/vf-login-probe.json
          echo
          echo "login probe status: $LOGIN_STATUS"
          if [ "$LOGIN_STATUS" != '401' ]; then
            echo 'Expected 401 from a healthy account store.'
            exit 1
          fi

          echo '--- register ---'
          curl --fail-with-body --silent --show-error \
            -c "$COOKIE_JAR" \
            -H 'Origin: https://vocabfast.net' \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/preview/auth/register" \
            --data "{\"name\":\"CI Smoke Test\",\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}"
          echo

          echo '--- authenticated me after register ---'
          curl --fail-with-body --silent --show-error -b "$COOKIE_JAR" "$BASE/api/preview/me"
          echo

          echo '--- save state ---'
          curl --fail-with-body --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Origin: https://vocabfast.net' \
            -H 'Content-Type: application/json' \
            -X PUT "$BASE/api/preview/state" \
            --data '{"state":{"schema":1,"storage":{"vocabfast.platform.ci":"ok"}}}'
          echo

          echo '--- logout ---'
          curl --fail-with-body --silent --show-error \
            -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -H 'Origin: https://vocabfast.net' \
            -X POST "$BASE/api/preview/auth/logout"
          echo

          echo '--- login after logout ---'
          curl --fail-with-body --silent --show-error \
            -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -H 'Origin: https://vocabfast.net' \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/preview/auth/login" \
            --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}"
          echo

          echo '--- authenticated me after login ---'
          curl --fail-with-body --silent --show-error -b "$COOKIE_JAR" "$BASE/api/preview/me"
          echo

          echo '--- load state after login ---'
          curl --fail-with-body --silent --show-error -b "$COOKIE_JAR" "$BASE/api/preview/state"
          echo

          echo '--- workers.dev health ---'
          curl --fail-with-body --silent --show-error https://vocabfast-language-preview.marcelst2003.workers.dev/api/preview/health
          echo
      - name: Cloudflare preview deployment not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare preview build is valid, but deployment was skipped."
          echo "Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic deployment."
          echo "The preview Worker is named vocabfast-language-preview and has no production route."

  worker-api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker sources
        run: npm run check
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-platform-dry
