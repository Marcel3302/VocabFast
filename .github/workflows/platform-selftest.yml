name: VocabFast platform checks
on:
  push:
    branches: [vocabfast-language-platform]
  workflow_dispatch:

jobs:
  platform-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocabfast-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build platform
        run: npm run build
