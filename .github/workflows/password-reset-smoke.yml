name: VocabFast password reset smoke
on:
  push:
    branches: [vocabfast-language-platform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-reset-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live password-reset configuration
        run: |
          set -euo pipefail
          BASE='https://vocabfast.net'
          TEST_EMAIL="reset-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          STATUS=$(curl --silent --show-error -o /tmp/vf-reset.json -w '%{http_code}' \
            -H 'Origin: https://vocabfast.net' \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/preview/auth/password-reset/request" \
            --data "{\"email\":\"$TEST_EMAIL\"}")
          cat /tmp/vf-reset.json
          echo
          echo "password reset probe status: $STATUS"
          if [ "$STATUS" != '200' ]; then
            echo 'Password reset is not fully configured in the live Worker.'
            exit 1
          fi
          node -e "const d=require('/tmp/vf-reset.json'); if(d.ok!==true) process.exit(1)"
          echo 'Live password-reset configuration is available.'
